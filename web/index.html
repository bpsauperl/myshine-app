<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="myShine: your Shine clear aligner treatment. Your plan, your aligner schedule, messages with your clinic and your documents.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="myShine">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>myShine</title>
  <!-- Start fetching the app at once, while the page is still being read. -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="manifest" href="manifest.json">
  <!-- The opening film is a picture only: taps go to the app (next scene, back, hold to pause). -->
  <style>flt-platform-view, flt-platform-view video { pointer-events: none; }</style>
</head>
<body>
  <!-- Shown while the app loads; removed when Flutter has drawn its first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1d1d1f; }
    #loading b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    #loading i { width: 22px; height: 22px; border-radius: 50%; border: 2.5px solid #e5e5ea; border-top-color: #1d1d1f; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) { html, body { background: #000000; } #loading { color: #f5f5f7; } #loading i { border-color: #38383a; border-top-color: #f5f5f7; } }
  </style>
  <div id="loading" aria-label="myShine"><b>myShine</b><i></i></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) { loading.remove(); }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
